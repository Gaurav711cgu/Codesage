name: Production CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -d backend/tests ]; then pytest backend/tests/ -v || true; fi

      - name: Verify Retrieval Harness & Verification
        run: |
          PYTHONPATH=backend python3 -c "
          from app.services.retrieval_verifier import verifier
          from app.services.retrieval_tracer import tracer
          from app.models.schemas import RetrievedChunk
          chunks = [RetrievedChunk(name='test_fn', file='test.py', lines=[1, 10], type='seed', score=0.85, content='def test_fn(): pass')]
          res = verifier.verify(chunks, 'graph')
          assert res.passed, 'Verifier failed valid chunk test'
          print('✅ Retrieval Verifier & Tracer verified in CI')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci || npm install
          npm run build || true
