name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check backend/app/ --output-format=github

      - name: Run mypy
        run: mypy backend/app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # warnings only for now — tighten after fixing types

  # ── Job 2: Security scan ──────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for CVEs
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2022-42969

      - name: Check for hardcoded secrets (git-secrets pattern)
        run: |
          # Reject any line containing a raw API key pattern
          if grep -rE "(AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,})" \
            --include="*.py" --include="*.ts" --include="*.js" \
            --exclude-dir=".git" --exclude-dir="node_modules" .; then
            echo "❌ Potential hardcoded secret detected — aborting"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  # ── Job 3: Test ───────────────────────────────────────────────────────────
  test:
    name: Test Suite (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=50 \
            -x
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Verify Retrieval Harness
        run: |
          cd backend
          python3 -c "
          from app.services.retrieval_verifier import verifier
          from app.models.schemas import RetrievedChunk
          chunks = [RetrievedChunk(name='test_fn', file='test.py', lines=[1, 10], type='seed', score=0.85, content='def test_fn(): pass')]
          res = verifier.verify(chunks, 'graph')
          assert res.passed, 'Verifier failed valid chunk test'
          print('✅ Retrieval Verifier verified')
          "
        env:
          PYTHONPATH: .

  # ── Job 4: Frontend Build ─────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

  # ── Job 5: Docker Build (linux/amd64) ────────────────────────────────────
  docker:
    name: Docker Build (linux/amd64)
    runs-on: ubuntu-latest
    needs: [test, security]
    # Only build on pushes to main or develop (not on every PR commit)
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false  # build only — push requires Docker Hub secrets
          tags: gaurav3412/codesage-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
