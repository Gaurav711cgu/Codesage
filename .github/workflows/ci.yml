name: CodeSageZ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov
        
    - name: Run Pytest
      env:
        PYTHONPATH: backend
        REDIS_URL: memory://
      run: |
        cd backend
        python -m pytest tests/ --cov=app --cov-report=xml

  test-ml-pipeline:
    name: ML Data Pipeline Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Run ML Dataset Filters Tests
      env:
        PYTHONPATH: training
      run: |
        pip install pytest
        python -m pytest training/tests/
